services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: cecas-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      SEED_DATA_PATH: ${SEED_DATA_PATH:-/app/seed}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
    - backend_uploads:/app/uploads

    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: cecas-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
  
volumes:
  backend_uploads:
