name: CECAS CI/CD Pipeline

# Trigger workflow on push to develop branch or manually
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-backend:
    name: Backend Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Build backend (package)
        working-directory: ./backend
        run: |
          set -euo pipefail
          ./mvnw -B clean package -DskipTests

      - name: Upload backend JAR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  build-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: |
          set -euo pipefail
          npm run build --if-present

      - name: Upload frontend dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker-deploy:
    name: Build Docker images & Deploy with docker-compose
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Prepare .env from .env.example
        run: |
          set -euo pipefail
          if [ -f .env.example ]; then
            cp .env.example .env
            chmod 600 .env || true
            echo ".env created from .env.example"
          else
            echo ".env.example not found; failing"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure docker compose available
        run: docker compose version

      - name: Inspect artifacts
        run: |
          set -euo pipefail
          echo "backend/target contents:"
          ls -la backend/target || true
          echo "frontend/dist contents:"
          ls -la frontend/dist || true

      - name: Build images via docker-compose
        run: |
          set -euo pipefail
          docker compose build --pull --no-cache

      - name: Start services
        run: |
          set -euo pipefail
          docker compose up -d

      - name: Wait for backend health
        run: |
          set -euo pipefail
          for i in {1..24}; do
            if curl -sSf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "backend healthy"; exit 0
            fi
            echo "waiting for backend ($i/24)..."
            sleep 5
          done
          echo "backend did not become healthy; dumping logs"
          docker compose logs backend --no-color | sed -n '1,300p' || true
          exit 1

      - name: Tear down services (always)
        if: always()
        run: |
          set -euo pipefail
          docker compose down --volumes --remove-orphans

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, docker-deploy]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "=========================================="
          echo "CECAS CI/CD Pipeline Summary"
          echo "=========================================="
          echo "Backend: ${{ needs.build-backend.result }}"
          echo "Frontend: ${{ needs.build-frontend.result }}"
          echo "Docker: ${{ needs.docker-deploy.result }}"

          if [[ \
            "${{ needs.build-backend.result }}" == "success" && \
            "${{ needs.build-frontend.result }}" == "success" && \
            "${{ needs.docker-deploy.result }}" == "success" ]]; then
            echo "Succeeded"
            exit 0
          else
            echo "Failed"
            exit 1
          fi