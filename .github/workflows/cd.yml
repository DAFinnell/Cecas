name: CECAS Release Build and Deploy

on:
  workflow_dispatch:   # manual only
  push:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.sha }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  BACKEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cecas-backend
  FRONTEND_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cecas-frontend

jobs:
  deploy:
    name: Build and Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend build
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend dist
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        run: |
          docker build -t $BACKEND_IMAGE:${IMAGE_TAG} -f backend/Dockerfile ./backend
          docker tag $BACKEND_IMAGE:${IMAGE_TAG} $BACKEND_IMAGE:latest
          docker push $BACKEND_IMAGE:${IMAGE_TAG}
          docker push $BACKEND_IMAGE:latest

      - name: Build and push frontend image
        run: |
          docker build -t $FRONTEND_IMAGE:${IMAGE_TAG} -f frontend/Dockerfile ./frontend
          docker tag $FRONTEND_IMAGE:${IMAGE_TAG} $FRONTEND_IMAGE:latest
          docker push $FRONTEND_IMAGE:${IMAGE_TAG}
          docker push $FRONTEND_IMAGE:latest

      - name: Prepare SSH key for deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add EC2 fingerprint
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2 instance
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          
          aws ecr get-login-password --region "${AWS_REGION}" | \
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ${EC2_USER}@${EC2_HOST} "docker login --username AWS --password-stdin '${ECR_REGISTRY}'"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ${EC2_USER}@${EC2_HOST} <<EOF
set -euo pipefail

cat > /home/${EC2_USER}/.env <<ENVFILE
BACKEND_IMAGE=${BACKEND_IMAGE}:${IMAGE_TAG}
FRONTEND_IMAGE=${FRONTEND_IMAGE}:${IMAGE_TAG}

DB_HOST=${DB_HOST}
DB_NAME=${DB_NAME}
DB_USER=${DB_USER}
DB_PASSWORD=${DB_PASSWORD}

SPRING_PROFILES_ACTIVE=prod
APP_SEED_ENABLED=false
SESSION_COOKIE_SECURE=false
ENVFILE

cd /home/${EC2_USER}
docker compose -f docker-compose.prod.yml pull
docker compose -f docker-compose.prod.yml up -d --remove-orphans
EOF