name: CECAS Production Deployment

run-name: >-
  Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }} to production

on:
  workflow_run:
    workflows: ["CECAS CI Workflow"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA from main to redeploy
        required: true
        type: string

permissions: {}

concurrency:
  group: cecas-production-deployment
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: production
      url: https://cecas.dafinnell.com

    permissions:
      contents: read
      id-token: write

    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ECR_REGISTRY: "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
      PUBLIC_URL: https://cecas.dafinnell.com

    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          for variable_name in \
            AWS_REGION \
            AWS_ACCOUNT_ID \
            AWS_ROLE_ARN \
            EC2_INSTANCE_ID; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required production env variable is missing: ${variable_name}"
              exit 1
            fi
          done

          if [[ ! "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The deployment commit must be a full 40-character lowercase SHA."
            exit 1
          fi

          if [[ "${AWS_REGION}" != "us-east-2" ]]; then
            echo "::error::AWS_REGION must be us-east-2."
            exit 1
          fi

          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must contain exactly 12 digits."
            exit 1
          fi

          expected_ecr_registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          if [[ "${ECR_REGISTRY}" != "${expected_ecr_registry}" ]]; then
            echo "::error::The derived ECR registry does not match the expected AWS account and region."
            exit 1
          fi

          expected_role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/cecas-github-deploy-role"

          if [[ "${AWS_ROLE_ARN}" != "${expected_role_arn}" ]]; then
            echo "::error::AWS_ROLE_ARN does not identify the expected deployment role."
            exit 1
          fi

          if [[ ! "${EC2_INSTANCE_ID}" =~ ^i-([0-9a-f]{8}|[0-9a-f]{17})$ ]]; then
            echo "::error::EC2_INSTANCE_ID is not a valid EC2 instance ID."
            exit 1
          fi

          echo "Deployment inputs passed validation."

      - name: Check out release commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm release commit belongs to main
        shell: bash
        run: |
          set -euo pipefail

          checked_out_sha="$(git rev-parse HEAD)"

          if [[ "${checked_out_sha}" != "${DEPLOY_SHA}" ]]; then
            echo "::error::The checked-out commit does not match the requested deployment commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${DEPLOY_SHA}" origin/main; then
            echo "::error::The requested deployment commit is not part of main."
            exit 1
          fi

          echo "Release commit is from main."

      - name: Configure AWS creds through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: cecas-prod-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Inspect release images in ECR
        id: image-state
        shell: bash
        run: |
          set -euo pipefail

          lookup_digest() {
            local repository_name="$1"

            aws ecr batch-get-image \
              --region "${AWS_REGION}" \
              --repository-name "${repository_name}" \
              --image-ids "imageTag=${DEPLOY_SHA}" \
              --query 'images[0].imageId.imageDigest' \
              --output text
          }

          backend_digest="$(lookup_digest "cecas-backend")"
          frontend_digest="$(lookup_digest "cecas-frontend")"

          if [[ "${backend_digest}" == "None" ]]; then
            backend_digest=""
          fi

          if [[ "${frontend_digest}" == "None" ]]; then
            frontend_digest=""
          fi

          digest_pattern='^sha256:[0-9a-f]{64}$'

          if [[ -n "${backend_digest}" && ! "${backend_digest}" =~ ${digest_pattern} ]]; then
            echo "::error::ECR returned an invalid backend image digest."
            exit 1
          fi

          if [[ -n "${frontend_digest}" && ! "${frontend_digest}" =~ ${digest_pattern} ]]; then
            echo "::error::ECR returned an invalid frontend image digest."
            exit 1
          fi

          backend_exists="false"
          frontend_exists="false"

          if [[ -n "${backend_digest}" ]]; then
            backend_exists="true"
          fi

          if [[ -n "${frontend_digest}" ]]; then
            frontend_exists="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${backend_exists}" != "true" || "${frontend_exists}" != "true" ]]; then
              echo "::error::Manual redeployment requires both SHA-tagged images to already exist in ECR."
              exit 1
            fi
          fi

          {
            echo "backend_exists=${backend_exists}"
            echo "backend_digest=${backend_digest}"
            echo "frontend_exists=${frontend_exists}"
            echo "frontend_digest=${frontend_digest}"
          } >> "${GITHUB_OUTPUT}"

          if [[ "${backend_exists}" == "true" && "${frontend_exists}" == "true" ]]; then
            echo "Both release images already exist and will be reused."
          else
            echo "Any missing release images will be built and published."
          fi

      - name: Login to Amazon ECR
        if: >-
          ${{
            steps.image-state.outputs.backend_exists == 'false' ||
            steps.image-state.outputs.frontend_exists == 'false'
          }}
        uses: aws-actions/amazon-ecr-login@v2.1.6
        with:
          mask-password: true

      - name: Set up Docker Buildx
        if: >-
          ${{
            steps.image-state.outputs.backend_exists == 'false' ||
            steps.image-state.outputs.frontend_exists == 'false'
          }}
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push backend image
        id: backend-image
        if: steps.image-state.outputs.backend_exists == 'false'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.ECR_REGISTRY }}/cecas-backend:${{ env.DEPLOY_SHA }}

      - name: Build and push frontend image
        id: frontend-image
        if: steps.image-state.outputs.frontend_exists == 'false'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.ECR_REGISTRY }}/cecas-frontend:${{ env.DEPLOY_SHA }}

      - name: Record immutable image references
        id: release-images
        shell: bash
        env:
          EXISTING_BACKEND_DIGEST: ${{ steps.image-state.outputs.backend_digest }}
          BUILT_BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          EXISTING_FRONTEND_DIGEST: ${{ steps.image-state.outputs.frontend_digest }}
          BUILT_FRONTEND_DIGEST: ${{ steps.frontend-image.outputs.digest }}
        run: |
          set -euo pipefail

          backend_digest="${EXISTING_BACKEND_DIGEST}"
          backend_source="reused from ECR"

          if [[ -z "${backend_digest}" ]]; then
            backend_digest="${BUILT_BACKEND_DIGEST}"
            backend_source="built and pushed"
          fi

          frontend_digest="${EXISTING_FRONTEND_DIGEST}"
          frontend_source="reused from ECR"

          if [[ -z "${frontend_digest}" ]]; then
            frontend_digest="${BUILT_FRONTEND_DIGEST}"
            frontend_source="built and pushed"
          fi

          digest_pattern='^sha256:[0-9a-f]{64}$'

          if [[ ! "${backend_digest}" =~ ${digest_pattern} ]]; then
            echo "::error::A valid backend image digest was not produced."
            exit 1
          fi

          if [[ ! "${frontend_digest}" =~ ${digest_pattern} ]]; then
            echo "::error::A valid frontend image digest was not produced."
            exit 1
          fi

          backend_image="${ECR_REGISTRY}/cecas-backend@${backend_digest}"
          frontend_image="${ECR_REGISTRY}/cecas-frontend@${frontend_digest}"

          {
            echo "BACKEND_IMAGE=${backend_image}"
            echo "FRONTEND_IMAGE=${frontend_image}"
          } >> "${GITHUB_ENV}"

          {
            echo "backend_digest=${backend_digest}"
            echo "backend_source=${backend_source}"
            echo "frontend_digest=${frontend_digest}"
            echo "frontend_source=${frontend_source}"
          } >> "${GITHUB_OUTPUT}"

      - name: Summarize release identity
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.release-images.outputs.backend_digest }}
          BACKEND_SOURCE: ${{ steps.release-images.outputs.backend_source }}
          FRONTEND_DIGEST: ${{ steps.release-images.outputs.frontend_digest }}
          FRONTEND_SOURCE: ${{ steps.release-images.outputs.frontend_source }}
        run: |
          {
            echo "### Production release info"
            echo
            echo "- Commit: \`${DEPLOY_SHA}\`"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Environment: \`production\`"
            echo "- AWS authentication: GitHub OIDC"
            echo
            echo "### Published images"
            echo
            echo "- Backend tag: \`cecas-backend:${DEPLOY_SHA}\`"
            echo "- Backend digest: \`${BACKEND_DIGEST}\`"
            echo "- Backend action: \`${BACKEND_SOURCE}\`"
            echo "- Frontend tag: \`cecas-frontend:${DEPLOY_SHA}\`"
            echo "- Frontend digest: \`${FRONTEND_DIGEST}\`"
            echo "- Frontend action: \`${FRONTEND_SOURCE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Dispatch deployment through SSM
        id: ssm-command
        shell: bash
        run: |
          set -euo pipefail
          set +x

          bundle_archive="$(mktemp)"
          request_file="$(mktemp)"

          cleanup() {
            rm -f -- "${bundle_archive}" "${request_file}"
          }

          trap cleanup EXIT

          tar \
            --create \
            --gzip \
            --file "${bundle_archive}" \
            docker-compose.prod.yml \
            deploy/remote-deploy.sh

          bundle_base64="$(base64 --wrap=0 "${bundle_archive}")"
          bundle_sha256="$(sha256sum "${bundle_archive}" | awk '{print $1}')"
          bundle_encoded_size="${#bundle_base64}"

          if (( bundle_encoded_size > 20000 )); then
            echo "::error::The encoded deployment bundle exceeds the workflow's 20 KB safety limit."
            exit 1
          fi

          jq -n \
            --arg instance_id "${EC2_INSTANCE_ID}" \
            --arg commit_sha "${DEPLOY_SHA}" \
            --arg backend_image "${BACKEND_IMAGE}" \
            --arg frontend_image "${FRONTEND_IMAGE}" \
            --arg bundle_base64 "${bundle_base64}" \
            --arg bundle_sha256 "${bundle_sha256}" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance_id],
              Comment: ("Deploy CECAS " + $commit_sha),
              TimeoutSeconds: 300,
              Parameters: {
                executionTimeout: ["1800"],
                commands: [
                  "set -euo pipefail",
                  "set +x",
                  "umask 077",
                  ("readonly COMMIT_SHA=" + ($commit_sha | @sh)),
                  ("readonly BACKEND_IMAGE=" + ($backend_image | @sh)),
                  ("readonly FRONTEND_IMAGE=" + ($frontend_image | @sh)),
                  ("readonly BUNDLE_BASE64=" + ($bundle_base64 | @sh)),
                  ("readonly BUNDLE_SHA256=" + ($bundle_sha256 | @sh)),
                  "readonly APP_ROOT=/opt/cecas",
                  "[[ \"${EUID}\" -eq 0 ]] || { echo \"Deployment must run as root.\" >&2; exit 1; }",
                  "[[ \"${COMMIT_SHA}\" =~ ^[0-9a-f]{40}$ ]] || { echo \"Invalid deployment commit SHA.\" >&2; exit 64; }",
                  "for command_name in base64 install mktemp sha256sum tar; do command -v \"${command_name}\" >/dev/null 2>&1 || { echo \"Required command is unavailable: ${command_name}\" >&2; exit 1; }; done",
                  "install -d -o root -g root -m 0750 \"${APP_ROOT}\" \"${APP_ROOT}/releases\"",
                  "readonly RELEASE_DIR=\"${APP_ROOT}/releases/${COMMIT_SHA}\"",
                  "readonly STAGING_DIR=\"$(mktemp -d \"${APP_ROOT}/.release-${COMMIT_SHA}.XXXXXX\")\"",
                  "readonly ARCHIVE_PATH=\"${STAGING_DIR}/release.tar.gz\"",
                  "cleanup_release_bundle() { rm -rf -- \"${STAGING_DIR}\"; }",
                  "trap cleanup_release_bundle EXIT",
                  "printf %s \"${BUNDLE_BASE64}\" | base64 --decode > \"${ARCHIVE_PATH}\"",
                  "printf \"%s  %s\\n\" \"${BUNDLE_SHA256}\" \"${ARCHIVE_PATH}\" | sha256sum --check --status || { echo \"Release bundle checksum verification failed.\" >&2; exit 1; }",
                  "tar --extract --gzip --file \"${ARCHIVE_PATH}\" --directory \"${STAGING_DIR}\"",
                  "[[ -f \"${STAGING_DIR}/docker-compose.prod.yml\" ]] || { echo \"The release bundle is missing docker-compose.prod.yml.\" >&2; exit 1; }",
                  "[[ -f \"${STAGING_DIR}/deploy/remote-deploy.sh\" ]] || { echo \"The release bundle is missing deploy/remote-deploy.sh.\" >&2; exit 1; }",
                  "install -d -o root -g root -m 0750 \"${RELEASE_DIR}\" \"${RELEASE_DIR}/deploy\"",
                  "install -o root -g root -m 0640 \"${STAGING_DIR}/docker-compose.prod.yml\" \"${RELEASE_DIR}/docker-compose.prod.yml\"",
                  "install -o root -g root -m 0750 \"${STAGING_DIR}/deploy/remote-deploy.sh\" \"${RELEASE_DIR}/deploy/remote-deploy.sh\"",
                  "\"${RELEASE_DIR}/deploy/remote-deploy.sh\" \"${COMMIT_SHA}\" \"${BACKEND_IMAGE}\" \"${FRONTEND_IMAGE}\""
                ]
              }
            }' > "${request_file}"

          command_id="$(
            aws ssm send-command \
              --region "${AWS_REGION}" \
              --cli-input-json "file://${request_file}" \
              --query 'Command.CommandId' \
              --output text
          )"

          if [[ ! "${command_id}" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::Systems Manager did not return a valid command ID."
            exit 1
          fi

          echo "command_id=${command_id}" >> "${GITHUB_OUTPUT}"
          echo "Systems Manager accepted the production deployment command."

      - name: Wait for EC2 deployment
        id: ec2-deployment
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm-command.outputs.command_id }}
        run: |
          set -euo pipefail
          set +x

          readonly max_attempts=210
          readonly polling_delay_seconds=10
          readonly lookup_retry_seconds=5

          status=""
          previous_status=""
          consecutive_lookup_failures=0

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if status="$(
              aws ssm get-command-invocation \
                --region "${AWS_REGION}" \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query 'Status' \
                --output text \
                2>/dev/null
            )"; then
              consecutive_lookup_failures=0
            else
              ((consecutive_lookup_failures += 1))

              if (( consecutive_lookup_failures > 12 )); then
                echo "::error::Unable to read the SSM command status after repeated attempts."
                exit 1
              fi

              sleep "${lookup_retry_seconds}"
              continue
            fi

            if [[ "${status}" != "${previous_status}" ]]; then
              echo "SSM deployment status: ${status}"
              previous_status="${status}"
            fi

            case "${status}" in
              Success|Failed|TimedOut|Cancelled)
                break
                ;;
              Pending|InProgress|Delayed|Cancelling)
                sleep "${polling_delay_seconds}"
                ;;
              *)
                echo "::error::Unexpected SSM command status: ${status}"
                exit 1
                ;;
            esac
          done

          if [[ "${status}" != "Success" &&
                "${status}" != "Failed" &&
                "${status}" != "TimedOut" &&
                "${status}" != "Cancelled" ]]; then
            echo "::error::The SSM deployment did not reach a terminal state before the polling timeout."
            exit 1
          fi

          standard_output="$(
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'StandardOutputContent' \
              --output text
          )"

          standard_error="$(
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'StandardErrorContent' \
              --output text
          )"

          response_code="$(
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'ResponseCode' \
              --output text
          )"

          if [[ -n "${standard_output}" && "${standard_output}" != "None" ]]; then
            echo "::group::EC2 deployment output"
            printf '%s\n' "${standard_output}"
            echo "::endgroup::"
          fi

          if [[ -n "${standard_error}" && "${standard_error}" != "None" ]]; then
            echo "::group::EC2 deployment errors"
            printf '%s\n' "${standard_error}"
            echo "::endgroup::"
          fi

          {
            echo "command_id=${COMMAND_ID}"
            echo "status=${status}"
            echo "response_code=${response_code}"
          } >> "${GITHUB_OUTPUT}"

          if [[ "${status}" != "Success" || "${response_code}" != "0" ]]; then
            echo "::error::The EC2 deployment failed with SSM status ${status} and response code ${response_code}."
            exit 1
          fi

          echo "The EC2 deployment completed successfully."

      - name: Verify public HTTPS
        id: public-smoke
        shell: bash
        run: |
          set -euo pipefail

          readonly max_attempts=12
          readonly retry_delay_seconds=10

          public_https_url="${PUBLIC_URL}/"
          public_health_url="${PUBLIC_URL}/actuator/health"
          public_http_url="${PUBLIC_URL/https:/http:}/"

          site_ready="false"

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            root_ready="false"
            health_ready="false"
            redirect_ready="false"

            if curl \
              --fail \
              --silent \
              --proto '=https' \
              --tlsv1.2 \
              --connect-timeout 5 \
              --max-time 15 \
              --output /dev/null \
              "${public_https_url}" \
              2>/dev/null; then
              root_ready="true"
            fi

            health_body=""

            if health_body="$(
              curl \
                --fail \
                --silent \
                --proto '=https' \
                --tlsv1.2 \
                --connect-timeout 5 \
                --max-time 15 \
                "${public_health_url}" \
                2>/dev/null
            )" &&
              jq --exit-status '.status == "UP"' \
                <<< "${health_body}" \
                >/dev/null 2>&1; then
              health_ready="true"
            fi

            redirect_result="$(
              curl \
                --silent \
                --connect-timeout 5 \
                --max-time 15 \
                --output /dev/null \
                --write-out '%{http_code} %{redirect_url}' \
                "${public_http_url}" \
                2>/dev/null ||
                true
            )"

            redirect_code="${redirect_result%% *}"
            redirect_target="${redirect_result#* }"

            if [[ "${redirect_code}" =~ ^30[1278]$ &&
                  "${redirect_target}" == "${public_https_url}" ]]; then
              redirect_ready="true"
            fi

            if [[ "${root_ready}" == "true" &&
                  "${health_ready}" == "true" &&
                  "${redirect_ready}" == "true" ]]; then
              site_ready="true"
              break
            fi

            echo "Public production verification is not ready yet (${attempt}/${max_attempts})."

            if (( attempt < max_attempts )); then
              sleep "${retry_delay_seconds}"
            fi
          done

          if [[ "${site_ready}" != "true" ]]; then
            echo "::error::Public production verification did not pass before the timeout."

            curl \
              --silent \
              --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --connect-timeout 5 \
              --max-time 15 \
              --output /dev/null \
              --write-out 'Frontend HTTPS status: %{http_code}\n' \
              "${public_https_url}" ||
              true

            curl \
              --silent \
              --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --connect-timeout 5 \
              --max-time 15 \
              --output /dev/null \
              --write-out 'Backend health status: %{http_code}\n' \
              "${public_health_url}" ||
              true

            curl \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --output /dev/null \
              --write-out 'HTTP redirect status: %{http_code}; target: %{redirect_url}\n' \
              "${public_http_url}" ||
              true

            exit 1
          fi

          echo "Public HTTPS, backend health, and HTTP redirect verification passed."

      - name: Summarize deployment results
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SSM_COMMAND_ID: ${{ steps.ssm-command.outputs.command_id }}
          SSM_DISPATCH_OUTCOME: ${{ steps.ssm-command.outcome }}
          SSM_STATUS: ${{ steps.ec2-deployment.outputs.status }}
          SSM_RESPONSE_CODE: ${{ steps.ec2-deployment.outputs.response_code }}
          EC2_DEPLOYMENT_OUTCOME: ${{ steps.ec2-deployment.outcome }}
          PUBLIC_SMOKE_OUTCOME: ${{ steps.public-smoke.outcome }}
        run: |
          set -euo pipefail

          command_id="${SSM_COMMAND_ID:-not-created}"
          dispatch_outcome="${SSM_DISPATCH_OUTCOME:-not-run}"
          ssm_status="${SSM_STATUS:-unavailable}"
          response_code="${SSM_RESPONSE_CODE:-unavailable}"
          ec2_outcome="${EC2_DEPLOYMENT_OUTCOME:-not-run}"
          public_outcome="${PUBLIC_SMOKE_OUTCOME:-not-run}"

          {
            echo
            echo "### Prod deployment result"
            echo
            echo "- SSM dispatch: \`${dispatch_outcome}\`"
            echo "- SSM command: \`${command_id}\`"
            echo "- EC2 deployment step: \`${ec2_outcome}\`"
            echo "- EC2 command status: \`${ssm_status}\`"
            echo "- EC2 response code: \`${response_code}\`"
            echo "- Public verification: \`${public_outcome}\`"
            echo "- Public URL: [${PUBLIC_URL}](${PUBLIC_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"
