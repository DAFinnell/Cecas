name: CECAS Production Deployment

run-name: >-
  Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }} to production

on:
  workflow_run:
    workflows: ["CECAS CI Workflow"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA from main to redeploy
        required: true
        type: string

permissions: {}

concurrency:
  group: cecas-production-deployment
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: production
      url: https://cecas.dafinnell.com

    permissions:
      contents: read
      id-token: write

    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          for variable_name in \
            AWS_REGION \
            AWS_ACCOUNT_ID \
            AWS_ROLE_ARN \
            EC2_INSTANCE_ID; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required production env variable is missing: ${variable_name}"
              exit 1
            fi
          done

          if [[ ! "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The deployment commit must be a full 40-character lowercase SHA."
            exit 1
          fi

          if [[ "${AWS_REGION}" != "us-east-2" ]]; then
            echo "::error::AWS_REGION must be us-east-2."
            exit 1
          fi

          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must contain exactly 12 digits."
            exit 1
          fi

          expected_role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/cecas-github-deploy-role"

          if [[ "${AWS_ROLE_ARN}" != "${expected_role_arn}" ]]; then
            echo "::error::AWS_ROLE_ARN does not identify the expected deployment role."
            exit 1
          fi

          if [[ ! "${EC2_INSTANCE_ID}" =~ ^i-([0-9a-f]{8}|[0-9a-f]{17})$ ]]; then
            echo "::error::EC2_INSTANCE_ID is not a valid EC2 instance ID."
            exit 1
          fi

          echo "Deployment inputs passed validation."

      - name: Check out release commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm release commit belongs to main
        shell: bash
        run: |
          set -euo pipefail

          checked_out_sha="$(git rev-parse HEAD)"

          if [[ "${checked_out_sha}" != "${DEPLOY_SHA}" ]]; then
            echo "::error::The checked-out commit does not match the requested deployment commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${DEPLOY_SHA}" origin/main; then
            echo "::error::The requested deployment commit is not part of main."
            exit 1
          fi

          echo "Release commit is from main."

      - name: Configure AWS creds through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: cecas-prod-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Summarize deployment identity
        shell: bash
        run: |
          {
            echo "### Production deployment identity"
            echo
            echo "- Commit: \`${DEPLOY_SHA}\`"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Environment: \`production\`"
            echo "- AWS authentication: GitHub OIDC"
          } >> "${GITHUB_STEP_SUMMARY}"
