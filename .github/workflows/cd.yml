name: CECAS Release Build

on:
  workflow_dispatch:   # manual only
  push:
    branches:
      - main
      
jobs:
  release-build:
    name: Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build backend JAR
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
          
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend dist
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker images
        run: docker compose -f docker-compose.prod.yml build

      - name: Upload production package
        run: |
          mkdir -p production/backend production/frontend
          cp backend/target/*.jar production/backend/ || true
          cp -r frontend/dist production/frontend/ || true

      - name: Upload backend JAR final artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-final
          path: backend/target/*.jar
          retention-days: 7

      - name: Upload frontend dist final artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-final
          path: frontend/dist
          retention-days: 7