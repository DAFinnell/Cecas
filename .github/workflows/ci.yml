name: CECAS CI Workflow

# Trigger workflow on push to develop branch or manually
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Run backend tests
        working-directory: ./backend
        run: ./mvnw -B test 
        
      - name: Build backend (package)
        working-directory: ./backend
        run: |
          set -euo pipefail
          ./mvnw -B clean package -DskipTests

      - name: Upload backend JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  build-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: |
          set -euo pipefail
          npm run build --if-present

      - name: Upload frontend dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker-deploy:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Prepare .env for compose
        run: |
          set -euo pipefail
          if [ -f .env.prod.local.example ]; then
            cp .env.prod.local.example .env
            chmod 600 .env || true
            echo ".env created from .env.prod.local.example"
          elif [ -f .env.example ]; then
            cp .env.example .env
            chmod 600 .env || true
            echo ".env created from .env.example"
          else
            echo "No env example file found; failing"
            exit 1
          fi
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure docker compose available
        run: docker compose version

      - name: Inspect artifacts
        run: |
          set -euo pipefail
          echo "backend/target contents:"
          ls -la backend/target || true
          echo "frontend/dist contents:"
          ls -la frontend/dist || true

      - name: Validate docker-compose config
        run: |
          set -euo pipefail
          docker compose config --quiet
          echo "docker-compose config is valid"
          
      - name: Build images via docker-compose
        run: |
          set -euo pipefail
          docker compose build 

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, docker-deploy]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "=========================================="
          echo "CECAS CI/CD Pipeline Summary"
          echo "=========================================="
          echo "Backend: ${{ needs.build-backend.result }}"
          echo "Frontend: ${{ needs.build-frontend.result }}"
          echo "Docker: ${{ needs.docker-deploy.result }}"

          if [[ \
            "${{ needs.build-backend.result }}" == "success" && \
            "${{ needs.build-frontend.result }}" == "success" && \
            "${{ needs.docker-deploy.result }}" == "success" ]]; then
            echo "Succeeded"
            exit 0
          else
            echo "Failed"
            exit 1
          fi