name: CECAS CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow}}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check backend formatting
        working-directory: ./backend
        run: ./mvnw -B spotless:check

      - name: Run backend tests
        working-directory: ./backend
        run: ./mvnw -B test 
        
  build-frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check frontend formatting
        working-directory: ./frontend
        run: npm run format:check

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test   

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  validate-containers:
    name: Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Confirm Docker Compose is available
        run: docker compose version

      - name: Validate local Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Validate production Compose configuration
        env:
          BACKEND_IMAGE: cecas-backend:ci
          FRONTEND_IMAGE: cecas-frontend:ci
          DB_HOST: mysql
          MYSQL_DATABASE: cecas
          MYSQL_USER: cecas
          MYSQL_PASSWORD: ci-placeholder
          MYSQL_ROOT_PASSWORD: ci-root-placeholder
          APP_SEED_ENABLED: "false"
          SESSION_COOKIE_SECURE: "true"
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate EC2 deployment script syntax
        run: bash -n deploy/remote-deploy.sh

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate \
              --config /etc/caddy/Caddyfile \
              --adapter caddyfile

      - name: Build backend production image
        run: docker build --file backend/Dockerfile --tag cecas-backend:ci ./backend

      - name: Build frontend production image
        run: docker build --file frontend/Dockerfile.prod --tag cecas-frontend:ci ./frontend

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, validate-containers]
    if: ${{ always() }}

    steps:
      - name: Confirm all required jobs pass
        env:
          BACKEND_RESULT: ${{ needs.build-backend.result }}
          FRONTEND_RESULT: ${{ needs.build-frontend.result }}
          CONTAINERS_RESULT: ${{ needs.validate-containers.result }}
        run: |
          if [ "$BACKEND_RESULT" != "success" ] ||
             [ "$FRONTEND_RESULT" != "success" ] ||
             [ "$CONTAINERS_RESULT" != "success" ]; then
            echo "One or more jobs did not succeed."
            exit 1
          fi
          
          echo "All required jobs succeeded."
